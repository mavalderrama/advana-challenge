[project]
name = "advana-desafio-mle-master"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.129.0",
    "numpy>=2.4.2",
    "pandas==2.3.2",
    "pydantic>=2.12.5",
    "scikit-learn>=1.8.0",
    "skops>=0.13.0",
    "gunicorn>=23.0.0",
    "uvicorn>=0.41.0",
    "xgboost>=3.2.0",
    "pytest-asyncio>=1.3.0",
]

[dependency-groups]
dev = [
    "coverage>=7.13.4",
    "jupyterlab>=4.5.4",
    "locust>=2.43.3",
    "matplotlib>=3.10.8",
    "mockito>=1.5.5",
    "mypy>=1.15.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.9.0",
    "seaborn>=0.13.2",
]

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [".venv", "__pycache__", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
check_untyped_defs = true
exclude = ["tests/"]
